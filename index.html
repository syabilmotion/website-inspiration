<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- X's video CDN may reject requests that carry another site's referrer -->
  <meta name="referrer" content="no-referrer">
  <title>Motion Inspiration</title>
  <meta name="description" content="A curated collection of motion design, SaaS, app demo and 3D video inspiration.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="nav">
    <a href="index.html" class="logo">motion<span>/</span>inspo</a>
    <div class="nav-right">
      <span class="count" id="count"></span>
      <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
        <span class="lbl"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1><em>Motion</em> references<br>for your next project.</h1>
      <p>Hover any video to preview it with sound. Click to watch it in full.</p>
    </section>

    <section class="toolbar">
      <div class="filters" id="filters"></div>
      <input type="search" id="search" placeholder="Search title or creator…" autocomplete="off">
    </section>

    <section class="grid" id="grid"></section>
    <p class="empty" id="empty" hidden>No videos found.</p>
  </main>

  <footer class="foot">© <span id="yr"></span> motion/inspo — all videos belong to their original creators.</footer>

  <script src="data.js"></script>
  <script src="assets/media.js"></script>
  <script src="assets/grid.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    const all = window.VIDEOS;
    const grid = document.getElementById("grid");
    const filters = document.getElementById("filters");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const cats = () => ["All", ...new Set([...(window.CATEGORIES || []), ...all.flatMap(v => v.tags || [])])];
    let active = new URLSearchParams(location.search).get("cat") || "All";

    function drawFilters() {
      filters.innerHTML = cats().map(t => {
        const n = t === "All" ? all.length : all.filter(v => (v.tags || []).includes(t)).length;
        return `<button data-t="${t}" class="${t === active ? "on" : ""}">${t} <small>${n}</small></button>`;
      }).join("");
    }
    drawFilters();
    filters.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      active = b.dataset.t;
      filters.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      history.replaceState(null, "", active === "All" ? location.pathname : "?cat=" + encodeURIComponent(active));
      draw();
    });
    // Lepas data tweet sampai, kategori auto mungkin bertambah -> kemas kini kiraan & grid
    Promise.all(all.map(Media.resolve)).then(() => { drawFilters(); if (active !== "All") draw(); });
    search.addEventListener("input", draw);

    function draw() {
      const q = search.value.trim().toLowerCase();
      const list = all.filter(v =>
        (active === "All" || (v.tags || []).includes(active)) &&
        (!q || (v.title + " " + (v.creator || "")).toLowerCase().includes(q)));
      Grid.render(grid, list);
      empty.hidden = list.length > 0;
      document.getElementById("count").textContent = list.length + (list.length === 1 ? " video" : " videos");
    }
    draw();

  </script>
</body>
</html>
